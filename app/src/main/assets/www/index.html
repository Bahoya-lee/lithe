<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1518">
<title>Lithe</title>
<style>
  :root{
    --brand:#115740;
    --brand-2:#3f9a78;
    --brand-soft:#123a2d;
    --ink:#eef6f3;
    --muted:#93a5ab;
    --line:#22343a;
    --bg:#0e1518;
    --card:#151f24;
    --danger:#ff7b7b;
    --warn:#f2b45c;
    --ok:#3f9a78;
    --shadow:0 12px 30px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    padding-bottom:calc(70px + env(safe-area-inset-bottom));
  }
  #app{max-width:560px;margin:0 auto;padding:0 14px}
  header.app-head{
    position:sticky;top:0;z-index:20;background:rgba(14,21,24,.88);backdrop-filter:blur(16px);
    padding:calc(12px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;
  }
  header.app-head h1{font-size:26px;margin:0;letter-spacing:-.4px;font-weight:800}
  header.app-head .date{color:var(--muted);font-size:13px}
  .view{display:none;animation:fade .18s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}
  .watch-card{background:linear-gradient(155deg,#0b1220,#16242f);color:#fff;border:none;border-radius:26px;padding:22px}
  .watch-card .greet{color:#fff}
  .watch-card .watch-sub{color:rgba(255,255,255,.62)}
  .watch-card .badge.good{background:rgba(255,255,255,.12);color:#b7e6d3}
  .card h2,.card h3{margin:0 0 10px;font-size:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:linear-gradient(135deg,#172a2e,#1a2f32);border:1px solid #24433c;border-radius:16px;padding:12px}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:22px;font-weight:700;margin-top:2px}
  .stat .s{color:var(--muted);font-size:11px;margin-top:2px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.good{background:#17372a;color:#7fe0b5}
  .badge.mid{background:#3a2d18;color:#f2c77c}
  .badge.high{background:#3b1c1f;color:#ff9b9b}
  .badge.low{background:#172a3c;color:#8fc2f5}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
  input,select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px;
    background:#0f171b;color:var(--ink);outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--brand-2);background:#101a1f}
  textarea{resize:vertical;min-height:80px}
  button{
    border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;
    background:var(--brand);color:#fff;
  }
  button:active{transform:scale(.98)}
  button.ghost{background:#223036;color:var(--ink)}
  button.danger{background:var(--danger)}
  button.warn{background:var(--warn)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center}
  .row>*{flex:1}
  .row button{flex:0 0 auto}
  nav.bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,26,31,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;justify-content:space-around;
    padding:5px 0 calc(5px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 22px rgba(0,0,0,.22);
  }
  nav.bottom button{
    background:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;
    flex:1;padding:4px 0;
  }
  nav.bottom button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav.bottom button.active{color:#5aa9ff}
  nav.bottom button.active svg{filter:drop-shadow(0 0 7px rgba(90,169,255,.55))}
  #view-ai.active{
    display:flex;flex-direction:column;min-height:0;
    height:calc(100dvh - 118px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  .ai-layout{display:flex;flex-direction:column;min-height:0;height:100%}
  .ai-head{flex:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 0 10px}
  .ai-head h2{margin:0;font-size:20px}
  .ai-head .muted{margin-top:2px;max-width:65vw}
  .ai-actions{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 8px}
  .ai-actions button{padding:9px 2px;font-size:11px;background:#1a2b30;border:1px solid var(--line);color:#dcebed;border-radius:12px}
  .ai-actions button.primary{background:var(--brand-2);color:#06110d}
  .chat-box{
    border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;margin:0;
    flex:1;min-height:0;display:flex;flex-direction:column;
  }
  .chat-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px;background:#0f171b}
  .composer{flex:none}
  .msg{max-width:82%;margin:8px 0;padding:10px 12px;border-radius:18px;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .msg.user{margin-left:auto;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant{display:flex;gap:8px;align-items:flex-start;background:none;border:none;padding:0;max-width:88%}
  .msg.assistant .avatar{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover;margin-top:2px}
  .msg.assistant .bubble{background:#1a262c;border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px}
  .msg.assistant .chat-action{margin-top:8px;width:100%;background:var(--brand);color:#fff;border-radius:12px;padding:10px;font-size:14px}
  .msg img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
  .msg .mtime{font-size:10px;opacity:.6;margin-top:4px}
  .typing{color:var(--muted);font-size:13px;padding:6px 4px}
  .composer{display:flex;gap:8px;padding:10px;background:#151f24;border-top:1px solid var(--line)}
  .composer input{flex:1}
  .composer button{flex:0 0 auto}
  .quick-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .quick-row button{flex:1 1 30%;background:var(--brand-soft);color:var(--brand);font-size:13px;padding:10px 8px}
  .notice{background:#332913;border:1px solid #564522;color:#f0d395;border-radius:12px;padding:10px 12px;font-size:12px;margin:10px 0}
  .notice.warn{background:#331b1d;border-color:#5c2d30;color:#ffb1b1}
  .food-card,.recipe-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
  .food-card .top,.recipe-card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .food-card h4,.recipe-card h4{margin:0 0 4px;font-size:15px}
  .food-card img{width:100%;border-radius:10px;margin-top:8px;max-height:220px;object-fit:cover}
  .macro{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .macro span{background:#223036;border-radius:8px;padding:4px 8px;font-size:12px;color:#c7d5d9}
  .chart-wrap{width:100%;overflow-x:auto}
  .chart-wrap svg{display:block}
  .tabs{display:flex;background:#1b2b30;border-radius:14px;padding:3px;gap:3px;margin:8px 0}
  .tabs button{flex:1;background:none;color:var(--muted);padding:9px;font-size:14px;border-radius:12px}
  .tabs button.active{background:#2c4046;color:#b7e6d3;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .ai-meals{margin:0 0 8px}
  .delta-up{color:var(--danger);font-weight:700}
  .delta-down{color:var(--ok);font-weight:700}
  .ring{flex:none;width:118px;height:118px}
  .greet{font-size:16px;font-weight:600}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .list-item:last-child{border-bottom:0}
  .muted{color:var(--muted);font-size:12px}
  .meal-block{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:14px;background:#111b20}
  .meal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
  .meal-head b{font-size:14px}
  .meal-sub{color:var(--muted);font-size:12px;text-align:right}
  .meal-items .food-card{margin:8px 0 0}
  .nutrition-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .nutrition-progress .np{background:#172a2e;border:1px solid #24433c;border-radius:12px;padding:8px}
  .nutrition-progress .k{color:var(--muted);font-size:11px}
  .nutrition-progress .v{font-size:15px;font-weight:700;margin-top:2px}
  .nutrition-progress .v small{font-size:10px;color:var(--muted);font-weight:500}
  .food-form{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;background:#111b20}
  .food-form .grid2{margin-top:4px}
  details.nutrition-extra{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  details.nutrition-extra summary{font-size:13px;color:var(--muted);cursor:pointer}
  .small{font-size:12px}
  .hidden{display:none!important}
  .mt{margin-top:10px}
  .flex{display:flex;gap:8px;align-items:center}
  .flex>*{flex:1}
  .icon-btn{width:38px;flex:0 0 38px;padding:0;font-size:18px;background:#223036;color:var(--ink)}
  #toast{
    position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(23,36,42,.92);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90%;text-align:center;
  }
  #toast.show{opacity:1}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  #lightbox img{max-width:94vw;max-height:94vh;border-radius:12px}
  .preview-img{max-width:180px;max-height:120px;border-radius:12px;border:1px solid var(--line);display:block;margin-top:8px}
  .ing-row{display:grid;grid-template-columns:1.4fr .8fr .7fr repeat(4,.7fr) auto;gap:6px;margin-bottom:6px;align-items:center}
  .ing-row input{padding:8px;font-size:13px}
  .ing-row button{flex:none;padding:8px}
  @media(max-width:380px){
    .ing-row{grid-template-columns:1fr 1fr;gap:6px}
    .ing-row button{grid-column:span 2}
  }
</style>
</head>
<body>
<div id="app">
  <header class="app-head">
    <h1>Lithe</h1>
    <span class="date" id="todayLabel"></span>
  </header>

  <main>
    <section id="view-home" class="view active"></section>
    <section id="view-ai" class="view"></section>
    <section id="view-recipes" class="view"></section>
    <section id="view-trends" class="view"></section>
    <section id="view-me" class="view"></section>
  </main>

  <nav class="bottom" id="bottomNav">
    <button data-view="home" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/><path d="M10 20v-5h4v5"/></svg>
      打卡
    </button>
    <button data-view="ai">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V6.5A2.5 2.5 0 0 1 7.5 4h7A2.5 2.5 0 0 1 17 6.5V18"/><path d="M3 18h18"/><path d="M9.5 8h5"/><path d="M9.5 12h5"/></svg>
      教练
    </button>
    <button data-view="recipes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17H6z"/><path d="M9.5 3.5v17"/><path d="M14.5 8h.01M14.5 11h.01M14.5 14h.01"/></svg>
      食谱
    </button>
    <button data-view="trends">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9"/><path d="M10 20V4"/><path d="M16 20v-6"/><path d="M22 20H2"/></svg>
      趋势
    </button>
    <button data-view="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.5-4 2.6-6 6.5-6s6 2 6.5 6"/></svg>
      我的
    </button>
  </nav>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galleryInput" accept="image/*" hidden>
<div id="lightbox" class="hidden" onclick="this.classList.add('hidden')"><img id="lightboxImg" alt=""></div>
<div id="toast"></div>

<script>
"use strict";

/* ============ 常量与状态 ============ */
const DB_NAME = "light-weight-tracker";
const DB_VERSION = 2;
const STORES = ["profile","checkins","foods","recipes","chat","settings","health"];
const DEFAULT_PROVIDER = "openai";
const DEFAULT_MODEL = "gpt-5-mini";
const DEFAULT_ENDPOINT = "https://api.openai.com/v1";
const UPDATE_URL = "https://github.com/Bahoya-lee/lithe/releases/latest/download/Lithe-latest.apk";
const APP_VERSION = "1.7.0";
const PROVIDERS = {
  openai:{label:"OpenAI", vision:true, endpoint:"https://api.openai.com/v1", model:"gpt-5-mini", models:["gpt-5-mini","gpt-5.1","gpt-5.5","gpt-5.1-mini"]},
  deepseek:{label:"DeepSeek", vision:false, endpoint:"https://api.deepseek.com", model:"deepseek-v4-flash-vision-exp", models:["deepseek-v4-flash-vision-exp","deepseek-chat","deepseek-reasoner"], visionModels:["deepseek-v4-flash-vision-exp"]}
};
const ACTIVITY = {
  sedentary:1.2, light:1.375, moderate:1.55, active:1.725, very_active:1.9
};
const MEALS = {
  breakfast:"早餐",
  lunch:"午餐",
  dinner:"晚餐",
  snack:"加餐"
};
const MEAL_ORDER = ["breakfast","lunch","dinner","snack"];
const NUTRITION_FIELDS = [
  {key:"calories",label:"热量",unit:"kcal"},
  {key:"protein",label:"蛋白质",unit:"g"},
  {key:"carbs",label:"碳水",unit:"g"},
  {key:"fat",label:"脂肪",unit:"g"},
  {key:"fiber",label:"膳食纤维",unit:"g"},
  {key:"sugar",label:"糖",unit:"g"},
  {key:"sodium",label:"钠",unit:"mg"},
  {key:"saturatedFat",label:"饱和脂肪",unit:"g"},
  {key:"cholesterol",label:"胆固醇",unit:"mg"},
  {key:"calcium",label:"钙",unit:"mg"},
  {key:"iron",label:"铁",unit:"mg"},
  {key:"potassium",label:"钾",unit:"mg"}
];
const PRIMARY_NUTRIENTS = ["calories","protein","carbs","fat","fiber","sugar","sodium"];

let db = null;
let profile = null;
let settings = null;
let memoryApiKey = "";
let chat = [];
let currentView = "home";
let period = "week";
let pendingPhoto = null;      // 已压缩、待分析的图片 dataURL
let textFoodMode = false;     // 文字记录食物模式
let currentMeal = "lunch";    // 当前记录/分析的食物餐次
let editingFoodId = null;
let msgSeq = 0;               // 聊天消息序号（用于流式更新 DOM）
let lastProvider = null;      // 用于服务商切换时重置模型/地址

/* ============ 工具函数 ============ */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.from(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function todayStr(){ return dateStr(new Date()); }
function showToast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove("show"),2600);
}
function showLightbox(src){ $("#lightboxImg").src=src; $("#lightbox").classList.remove("hidden"); }
function openUpdate(){ if(UPDATE_URL) location.href=UPDATE_URL; }
function uid(){ return (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2)); }

function num(v){ const n=+v; return Number.isFinite(n)?n:0; }
function apiFieldName(key){
  const map={
    calories:"calories",
    protein:"protein_g",
    carbs:"carbs_g",
    fat:"fat_g",
    fiber:"fiber_g",
    sugar:"sugar_g",
    sodium:"sodium_mg",
    saturatedFat:"saturated_fat_g",
    cholesterol:"cholesterol_mg",
    calcium:"calcium_mg",
    iron:"iron_mg",
    potassium:"potassium_mg"
  };
  return map[key]||key;
}
function foodNutrient(f,key){
  const direct=f?.[key];
  if(direct!=null && Number.isFinite(+direct)) return +direct;
  const api=apiFieldName(key);
  const legacy=f?.[api];
  if(legacy!=null && Number.isFinite(+legacy)) return +legacy;
  return 0;
}
function normalizeFoodRecord(j,image,meal,source){
  const mealKey=MEALS[meal]?meal:"snack";
  const out={
    id:uid(),date:todayStr(),createdAt:Date.now(),image:image||null,
    name:j.name||"食物", estimatedWeight:j.estimated_weight_g!=null?+j.estimated_weight_g:null,
    meal:mealKey,mealLabel:MEALS[mealKey],source:source||"ai",items:j.items||[],notes:j.notes||""
  };
  NUTRITION_FIELDS.forEach(f=>{
    const api=apiFieldName(f.key);
    const v=j[f.key]!=null?j[f.key]:j[api];
    out[f.key]=v!=null?+v:0;
  });
  return out;
}
function nutritionTotal(foods){
  const t={};
  NUTRITION_FIELDS.forEach(f=>t[f.key]=0);
  (foods||[]).forEach(f=>{
    NUTRITION_FIELDS.forEach(x=>{ t[x.key]+=foodNutrient(f,x.key); });
  });
  return t;
}
function currentWeightForTarget(checks){
  return currentWeight(checks) || (profile&&profile.targetWeightKg) || 70;
}
function computedNutritionTargets(w){
  const calories=calcCalorieTarget(profile,w)||2000;
  const refW=Math.max(35,w||70);
  const proteinFactor=(profile&&profile.goal==="gain")?1.8:(profile&&profile.goal==="lose"?1.5:1.2);
  const protein=Math.max(50,Math.round(refW*proteinFactor));
  const fat=Math.max(35,Math.round(calories*0.27/9));
  const carbs=Math.max(80,Math.round((calories-protein*4-fat*9)/4));
  return {
    calories,
    protein,
    carbs,
    fat,
    fiber:25,
    sugar:50,
    sodium:2000,
    saturatedFat:Math.round(fat*0.35),
    cholesterol:300,
    calcium:800,
    iron:12,
    potassium:2000
  };
}
function dailyNutritionTargets(w){
  const custom=(settings&&settings.nutritionTargets)||null;
  const fallback=computedNutritionTargets(w);
  if(!custom) return fallback;
  const out={...fallback};
  NUTRITION_FIELDS.forEach(f=>{
    const v=custom[f.key];
    if(v!=null && Number.isFinite(+v) && +v>0) out[f.key]=+v;
  });
  return out;
}
function dailyCalorieTarget(w){
  return dailyNutritionTargets(w).calories;
}
function formatNutrient(v,key){
  if(v==null || !Number.isFinite(+v)) return "--";
  const n=+v;
  return n<10 && ["iron","saturatedFat","fat","protein","carbs","fiber","sugar"].includes(key)
    ? n.toFixed(1).replace(/\.0$/,"")
    : String(Math.round(n));
}
function nutritionBrief(t){
  return `热量 ${Math.round(t.calories||0)} kcal · 蛋白质 ${Math.round(t.protein||0)}g · 碳水 ${Math.round(t.carbs||0)}g · 脂肪 ${Math.round(t.fat||0)}g`;
}
function mealKeyOf(f){
  return MEALS[f&&f.meal]?f.meal:"snack";
}

function calcAge(birth){
  if(!birth) return null;
  const b=new Date(birth+"T00:00:00"); if(isNaN(b)) return null;
  const now=new Date(); let a=now.getFullYear()-b.getFullYear();
  const m=now.getMonth()-b.getMonth();
  if(m<0 || (m===0 && now.getDate()<b.getDate())) a--;
  return Math.max(0,a);
}
function calcBMI(w,h){
  if(!w||!h) return null;
  const m=h/100; return +(w/(m*m)).toFixed(1);
}
function bmiText(b){
  if(b==null) return {t:"--",cls:""};
  if(b<18.5) return {t:"偏瘦",cls:"low"};
  if(b<24) return {t:"正常",cls:"good"};
  if(b<28) return {t:"超重",cls:"mid"};
  return {t:"肥胖",cls:"high"};
}
function calcBMR(p,w){
  if(!p||!p.heightCm||!w) return null;
  const age=calcAge(p.birthDate); if(age==null) return null;
  const base=10*w+6.25*p.heightCm-5*age;
  if(p.gender==="female") return Math.round(base-161);
  if(p.gender==="male") return Math.round(base+5);
  return Math.round(base-78); // 其他：取中间值
}
function calcTDEE(p,w){
  const bmr=calcBMR(p,w); if(!bmr) return null;
  const f=ACTIVITY[p.activityLevel]||1.2;
  return Math.round(bmr*f);
}
function calcCalorieTarget(p,w){
  const tdee=calcTDEE(p,w); if(!tdee) return null;
  let target=tdee;
  if(p.goal==="lose"){
    const kgPerWeek=Math.max(0.2, Math.min(1.5, Number(p.weeklyLossKg)||0.5));
    target=tdee-Math.round(kgPerWeek*7700/7);
  } else if(p.goal==="gain"){
    target=tdee+300;
  }
  return Math.max(1200,target);
}
function currentWeight(checks){
  if(!checks.length) return null;
  return checks[checks.length-1].weightKg;
}

/* ============ IndexedDB ============ */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const d=req.result;
      STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"id"}); });
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function idbGet(store,key){
  return new Promise((resolve,reject)=>{
    const t=db.transaction(store,"readonly").objectStore(store).get(key);
    t.onsuccess=()=>resolve(t.result); t.onerror=()=>reject(t.error);
  });
}
function idbGetAll(store){
  return new Promise((resolve,reject)=>{
    const t=db.transaction(store,"readonly").objectStore(store).getAll();
    t.onsuccess=()=>resolve(t.result||[]); t.onerror=()=>reject(t.error);
  });
}
function idbPut(store,val){
  return new Promise((resolve,reject)=>{
    const t=db.transaction(store,"readwrite").objectStore(store).put(val);
    t.onsuccess=()=>resolve(); t.onerror=()=>reject(t.error);
  });
}
function idbDelete(store,key){
  return new Promise((resolve,reject)=>{
    const t=db.transaction(store,"readwrite").objectStore(store).delete(key);
    t.onsuccess=()=>resolve(); t.onerror=()=>reject(t.error);
  });
}
function idbClear(store){
  return new Promise((resolve,reject)=>{
    const t=db.transaction(store,"readwrite").objectStore(store).clear();
    t.onsuccess=()=>resolve(); t.onerror=()=>reject(t.error);
  });
}

function bindGlobal(){

          no_camera:"当前设备没有可用相机",

      showToast("照片已就绪");
      if(currentView!=="ai") switchView("ai");

function calorieRingSVG(target,consumed){
  const r=48, c=2*Math.PI*r;
  const pct=target&&target>0?Math.min(1,Math.max(0,consumed/target)):0;
  const color=target?(pct>=1?"#e05252":(pct>=0.8?"#e6a23c":"#115740")):"#d6dee1";

  return `<svg width="118" height="118" viewBox="0 0 118 118" role="img" aria-label="剩余热量">
    <circle cx="59" cy="59" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/>
    <circle cx="59" cy="59" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct)).toFixed(1)}" transform="rotate(-90 59 59)"/>
    <text x="59" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">${label}</text>
    <text x="59" y="75" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.65)">剩余 kcal</text>

}

async function generateDailyPlan(){
  if(!getApiKey()){ showToast("请先在「我的」配置 API Key"); return; }

  try{
    const ctx=await healthContext();

}

async function callAI(input, instructions, jsonMode){

async function callOpenAI(input, instructions, jsonMode){
  const key=getApiKey();
  if(!key) throw new Error("未配置 API Key");
  const base=(settings.endpoint||PROVIDERS.openai.endpoint).replace(/\/+$/,"");
  const body={ model:settings.model||PROVIDERS.openai.model, input };
  if(instructions) body.instructions=instructions;
  if(jsonMode) body.text={format:{type:"json_object"}};
  const resp=await fetch(base+"/responses",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify(body)
  });
  if(!resp.ok){
    let err=""; try{ err=(await resp.text()).slice(0,300); }catch(_){}
    throw new Error("API "+resp.status+(err?"："+err:""));
  }
  const data=await resp.json();
  let text=data.output_text;
  if(!text && Array.isArray(data.output)){
    text=data.output.map(o=>{
      if(typeof o.content==="string") return o.content;
      if(Array.isArray(o.content)) return o.content.map(c=>c.text||"").join("");
      return "";
    }).join("\n");
  }
  return (text||"").trim();
}

async function callDeepSeek(input, instructions, jsonMode){
  const key=getApiKey();
  if(!key) throw new Error("未配置 API Key");
  const base=(settings.endpoint||PROVIDERS.deepseek.endpoint).replace(/\/+$/,"");
  const messages=[];
  if(instructions) messages.push({role:"system",content:instructions});
  messages.push(...inputToDeepSeekMessages(input));
  const resp=await fetch(base+"/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:settings.model||PROVIDERS.deepseek.model,messages,stream:false})
  });
  if(!resp.ok){
    let err=""; try{ err=(await resp.text()).slice(0,300); }catch(_){}
    throw new Error("API "+resp.status+(err?"："+err:""));
  }
  const data=await resp.json();
  const c=data.choices&&data.choices[0]&&data.choices[0].message;
  return (c&&c.content||"").trim();
}
function inputToDeepSeekMessages(input){
  return (input||[]).map(item=>{
    if(Array.isArray(item.content)){
      const parts=item.content.map(p=>{
        if(p.type==="text"||p.type==="input_text") return {type:"text",text:p.text||""};
        if(p.type==="image_url"||p.type==="input_image"){
          const url=(p.image_url&&typeof p.image_url==="object")?p.image_url.url:p.image_url;
          if(url) return {type:"image_url",image_url:{url}};
        }
        return null;
      }).filter(Boolean);
      return {role:item.role||"user",content:parts};
    }
    return {role:item.role||"user",content:item.content||""};
  });
}

async function callAIStream(input, instructions, onDelta){
  if(settings&&settings.provider==="deepseek") return callDeepSeekStream(input,instructions,onDelta);
  return callOpenAIStream(input,instructions,onDelta);
}

async function callOpenAIStream(input, instructions, onDelta){
  const key=getApiKey();
  if(!key) throw new Error("未配置 API Key");
  const base=(settings.endpoint||PROVIDERS.openai.endpoint).replace(/\/+$/,"");
  const body={ model:settings.model||PROVIDERS.openai.model, input, stream:true };
  if(instructions) body.instructions=instructions;
  const resp=await fetch(base+"/responses",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify(body)
  });
  if(!resp.ok){
    let err=""; try{ err=(await resp.text()).slice(0,300); }catch(_){}
    throw new Error("API "+resp.status+(err?"："+err:""));
  }
  const reader=resp.body.getReader();
  const dec=new TextDecoder("utf-8");
  let buf="", full="";
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,idx).trim(); buf=buf.slice(idx+1);
      if(!line.startsWith("data:")) continue;
      const payload=line.slice(5).trim();
      if(payload==="[DONE]") continue;
      try{
        const j=JSON.parse(payload);
        if(j.type==="response.output_text.delta" && j.delta){
          full+=j.delta; onDelta(j.delta);
        }
      }catch(_){}
    }
  }
  return full;
}

async function callDeepSeekStream(input, instructions, onDelta){
  const key=getApiKey();
  if(!key) throw new Error("未配置 API Key");
  const base=(settings.endpoint||PROVIDERS.deepseek.endpoint).replace(/\/+$/,"");
  const messages=[];
  if(instructions) messages.push({role:"system",content:instructions});

  const resp=await fetch(base+"/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:settings.model||PROVIDERS.deepseek.model,messages,stream:true})
  });
  if(!resp.ok){
    let err=""; try{ err=(await resp.text()).slice(0,300); }catch(_){}
    throw new Error("API "+resp.status+(err?"："+err:""));
  }
  const reader=resp.body.getReader();
  const dec=new TextDecoder("utf-8");
  let buf="", full="";
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,idx).trim(); buf=buf.slice(idx+1);
      if(!line.startsWith("data:")) continue;
      const payload=line.slice(5).trim();
      if(payload==="[DONE]") continue;
      try{
        const j=JSON.parse(payload);
        const delta=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
        if(delta){ full+=delta; onDelta(delta); }
      }catch(_){}

}

  if(checks.length){
    const recent=checks.slice(-5).map(c=>c.date+"="+c.weightKg+"kg").join("，");
    line+="最近体重记录："+recent+"。";
    const first=checks[0].weightKg, last=checks[checks.length-1].weightKg;
    line+="\n从首次到最近共变化 "+(last-first).toFixed(1)+"kg。";
  }else{
    line+="暂无体重打卡记录。";
  }
  return line;
}

async function syncHealth(){
  try{
    if(window.HealthBridge && window.HealthBridge.healthStatus){
      const status=JSON.parse(window.HealthBridge.healthStatus()||"{}");
      if(status && status.available && status.granted){
        showToast("正在从 Health Connect 同步…");
        window.HealthBridge.readHealth();
        return;
      }
      if(status && status.available && !status.granted){
        showToast("需要授权后才能读取手机健康数据");
        window.HealthBridge.requestHealthPermissions();
        return;
      }
      if(window.HealthBridge && window.HealthBridge.requestActivityPermission && status && status.localAvailable){
        showToast("Health Connect 不可用，切换到本机计步传感器");
        window.HealthBridge.requestActivityPermission();
        return;
      }
      const tip=status&&status.isVivo
        ?"vivo 健康数据需要 vivo Health Kit 授权；请先打开 vivo 健康，确认已同步到 Health Connect，或使用本机计步传感器。"
        :((status&&status.error)||"当前设备不支持自动读取，请手动记录");
      showToast(tip);
    }else if(window.HealthBridge && window.HealthBridge.readSteps){
      const j=JSON.parse(window.HealthBridge.readSteps()||"{}");
      if(j && j.steps!=null){
        const checks=(await idbGetAll("checkins")).sort((a,b)=>a.date.localeCompare(b.date));
        const w=currentWeight(checks)||70;
        const active=Math.round(j.steps*0.04*(w/70));
        const bmr=calcBMR(profile,w)||1500;
        await idbPut("health",{id:todayStr(),date:todayStr(),steps:+j.steps,activeCalories:active,totalCalories:Math.round(bmr+active),source:"device",updatedAt:Date.now()});
        showToast("已同步今日步数与估算消耗");
        renderTrends();
      }else{
        showToast((j&&j.error)||"未读取到步数");
      }
    }else{
      showToast("当前设备不支持自动读取，请手动记录");
    }
  }catch(e){
    showToast("同步失败："+e.message);
  }
}

async function onHealthBridgeResult(raw){
  try{
    const j=typeof raw==="object"?raw:JSON.parse(raw||"{}");
    if(!j || j.error){
      showToast(j&&j.error?j.error:"未读取到健康数据");
      return;
    }
    if(j.steps==null && j.activeCalories==null && j.totalCalories==null){
      showToast("手机里还没有今天的健康数据");
      return;
    }
    let steps=j.steps!=null?Math.round(+j.steps):null;
    let active=j.activeCalories!=null?Math.round(+j.activeCalories):null;
    let total=j.totalCalories!=null?Math.round(+j.totalCalories):null;
    if((j.source==="device_sensor") && steps!=null){
      const checks=(await idbGetAll("checkins")).sort((a,b)=>a.date.localeCompare(b.date));
      const w=currentWeight(checks)||70;
      active=Math.round(steps*0.04*(w/70));

    await idbPut("health",{
      id:todayStr(),date:todayStr(),

      totalCalories:total,

    showToast("健康数据同步失败："+e.message);
  }
}

function periodPoints(checks){
  const now=new Date();
  if(period==="week"){
    const days=[];
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); const s=dateStr(d);
      const c=checks.find(x=>x.date===s); days.push({label:s.slice(5).replace("-","/"), value:c?c.weightKg:null, date:s}); }
    return days;
  }
  if(period==="month"){
    const days=[];
    for(let i=29;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); const s=dateStr(d);
      const c=checks.find(x=>x.date===s); days.push({label:s.slice(5).replace("-","/"), value:c?c.weightKg:null, date:s}); }
    return days;
  }
  // 年：按月平均
  const months=[]; const cur=new Date(now.getFullYear(),now.getMonth(),1);
  for(let i=11;i>=0;i--){
    const d=new Date(cur.getFullYear(),cur.getMonth()-i,1);
    const key=d.getFullYear()+"-"+(d.getMonth()+1);
    const inM=checks.filter(c=>c.date.startsWith(key));
    const avg=inM.length?inM.reduce((a,c)=>a+c.weightKg,0)/inM.length:null;
    months.push({label:(d.getMonth()+1)+"月",value:avg!=null?+avg.toFixed(1):null,count:inM.length});
  }
  return months;
}

function drawLineChart(container,pts){
  container.innerHTML="";
  const valid=pts.filter(p=>p.value!=null);
  if(valid.length<2){
    container.innerHTML=`<div class="muted" style="padding:20px;text-align:center">记录不足，暂无法绘制趋势图</div>`;
    return;
  }
  const W=600,H=260,L=48,R=14,T=18,B=34;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.style.width="100%"; svg.style.height="auto";
  const vals=valid.map(p=>p.value);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ min-=0.5; max+=0.5; }
  const pad=(max-min)*0.18; min-=pad; max+=pad;
  const x=i=>L+(W-L-R)*i/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  const gridTicks=4;
  for(let i=0;i<=gridTicks;i++){
    const v=min+(max-min)*i/gridTicks, yy=y(v);
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",L);line.setAttribute("x2",W-R);line.setAttribute("y1",yy);line.setAttribute("y2",yy);
    line.setAttribute("stroke","#e6ecef");line.setAttribute("stroke-width",1);
    svg.appendChild(line);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",L-8);t.setAttribute("y",yy+4);t.setAttribute("text-anchor","end");t.setAttribute("font-size",10);t.setAttribute("fill","#6b7a80");
    t.textContent=v.toFixed(1); svg.appendChild(t);
  }
  // 标签（最多取 6 个）
  const step=Math.max(1,Math.ceil(pts.length/6));
  pts.forEach((p,i)=>{
    if(i%step!==0 && i!==pts.length-1) return;
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",x(i));t.setAttribute("y",H-12);t.setAttribute("text-anchor","middle");t.setAttribute("font-size",10);t.setAttribute("fill","#6b7a80");
    t.textContent=p.label; svg.appendChild(t);
  });
  // 折线
  let path="", first=true;
  pts.forEach((p,i)=>{
    if(p.value==null) return;
    path+=(first?"M":"L")+x(i).toFixed(1)+" "+y(p.value).toFixed(1)+" "; first=false;
  });
  const pl=document.createElementNS("http://www.w3.org/2000/svg","path");
  pl.setAttribute("d",path);pl.setAttribute("fill","none");pl.setAttribute("stroke","#0f9f8f");pl.setAttribute("stroke-width",2.5);pl.setAttribute("stroke-linejoin","round");
  svg.appendChild(pl);
  // 数据点
  pts.forEach((p,i)=>{
    if(p.value==null) return;
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x(i));c.setAttribute("cy",y(p.value));c.setAttribute("r",3);c.setAttribute("fill","#0f9f8f");
    svg.appendChild(c);
  });
  container.appendChild(svg);
}

      </div>
    </div>

    <div class="card">
      <h2>AI 接口配置</h2>

      <input id="set-model" list="modelList" value="${esc(settings.model||provider().model)}">
      <datalist id="modelList"></datalist>
      <label>API 地址</label>

      <label class="flex" style="align-items:center">
        <input type="checkbox" id="set-persist" style="width:auto;flex:none" ${settings.apiKeyPersist!==false?"checked":""}>

        <button class="ghost" onclick="clearKey()">清除 Key</button>

      <div class="notice">安全提示：本地网页直接调用 API，Key 只存于你手机浏览器的本地存储中，不会上传到我的服务器。请勿在他人设备上填写个人 Key。</div>
    </div>

    <div class="card">
      <h2>版本与更新</h2>
      <div class="muted">当前版本 ${APP_VERSION} · 点击下载最新安装包。</div>
      <div class="row mt"><button onclick="openUpdate()">⬇️ 检查更新并下载</button></div>
    </div>

    <div class="card">
      <h2>数据管理</h2>
      <div class="muted">所有记录（体重、食物、食谱、对话）都保存在本机 IndexedDB 中。</div>
      <div class="grid2 mt">
        <button class="ghost" onclick="exportData()">⬇️ 导出备份</button>
        <button class="ghost" onclick="document.getElementById('importInput').click()">⬆️ 导入备份</button>
      </div>
      <input type="file" id="importInput" accept="application/json" hidden>
      <div class="row mt"><button class="danger" onclick="clearAllData()">🗑 清空全部数据</button></div>
    </div>
    <div class="notice">⚕️ 本应用仅用于日常健康记录，AI 建议不构成医疗诊断。有疾病史、怀孕、代谢异常或体重快速异常变化时，请及时就医。</div>
  `;
  $("#importInput").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) importData(f); e.target.value=""; });
  onProviderChange();
}

function onProviderChange(){
  const sel=$("#set-provider");
  const cur=sel?sel.value:"openai";
  const prov=PROVIDERS[cur]||PROVIDERS.openai;
  const changed=lastProvider!==null&&lastProvider!==cur;
  const dl=$("#modelList"); if(dl) dl.innerHTML=(prov.models||[]).map(m=>`<option value="${m}"></option>`).join("");
  const m=$("#set-model");
  if(m && (changed || !m.value || !(prov.models||[]).includes(m.value))) m.value=prov.model;
  const ep=$("#set-endpoint");
  if(ep && (changed || !ep.value)) ep.value=prov.endpoint;
  lastProvider=cur;
}

async function saveProfile(){
  const height=parseFloat($("#pf-height").value);
  const birth=$("#pf-birth").value;
  if(!height || height<80 || height>250){ showToast("请输入有效身高 (80–250 cm)"); return; }
  if(!birth){ showToast("请填写出生日期"); return; }
  profile={
    id:"main", gender:$("#pf-gender").value, birthDate:birth, heightCm:height,
    targetWeightKg:$("#pf-target").value?parseFloat($("#pf-target").value):null,
    activityLevel:$("#pf-activity").value, goal:$("#pf-goal").value,
    weeklyLossKg:Math.max(0.1,Math.min(1.5,+$("#pf-weekly").value||0.5))
  };
  await idbPut("profile",profile);
  showToast("身体数据已保存");
}

async function saveNutritionTargets(){
  const get=s=>{ const v=parseFloat($(s).value); return Number.isFinite(v)&&v>0?Math.round(v):null; };
  const targets={};
  NUTRITION_FIELDS.forEach(f=>{
    const id=f.key==="saturatedFat"?"nt-saturatedFat":"nt-"+f.key;
    const v=get("#"+id);
    if(v!=null) targets[f.key]=v;
  });
  if(!targets.calories){ showToast("请填写每日总热量目标"); return; }
  settings=settings||{};
  settings.nutritionTargets=targets;
  await idbPut("settings",settings);
  showToast("每日营养目标已保存");
  renderHome();
}

async function resetNutritionTargets(){
  if(!confirm("恢复为根据身体数据自动计算的默认营养目标？")) return;
  settings=settings||{};
  delete settings.nutritionTargets;
  await idbPut("settings",settings);
  showToast("已恢复默认营养目标");
  renderMe();
}

async function saveSettings(){
  const persist=$("#set-persist").checked;
  const key=$("#set-key").value.trim();
  const prov=$("#set-provider").value;
  const provDef=PROVIDERS[prov]||PROVIDERS.openai;
  const model=$("#set-model").value.trim()||provDef.model;
  const endpoint=$("#set-endpoint").value.trim()||provDef.endpoint;
  const base={id:"main",provider:prov,model,endpoint,apiKeyPersist:persist,personaName:$("#set-persona-name").value.trim()||"Piggy",personaPrompt:$("#set-persona-prompt").value.trim(),dailyPlan:settings.dailyPlan,nutritionTargets:settings.nutritionTargets};
  if(persist){
    memoryApiKey="";
    settings={...base,apiKey:key};
  }else{
    memoryApiKey=key;
    settings={...base,apiKey:""};
  }
  await idbPut("settings",settings);
  showToast(persist&&key?"设置已保存":(key?"已保存（Key 仅本次运行有效）":"设置已保存"));
}
async function clearKey(){
  memoryApiKey=""; settings.apiKey=""; await idbPut("settings",settings);
  showToast("API Key 已清除"); renderMe();
}

async function exportData(){
  const data={version:1, exportedAt:new Date().toISOString()};
  for(const s of STORES){ data[s]=await idbGetAll(s); }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="轻盈记备份_"+todayStr()+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importData(file){
  try{
    const text=await readFile(file); const data=JSON.parse(text);
    for(const s of STORES){
      if(Array.isArray(data[s])) for(const rec of data[s]) await idbPut(s,rec);
    }
    showToast("导入成功，正在刷新…"); setTimeout(()=>location.reload(),800);
  }catch(e){ showToast("导入失败："+e.message); }
}
async function clearAllData(){
  if(!confirm("确定清空全部本地数据？此操作不可恢复（建议先导出备份）。")) return;
  for(const s of STORES) await idbClear(s);
  chat=[]; pendingPhoto=null; memoryApiKey=""; currentMeal="lunch"; textFoodMode=false; editingFoodId=null;
  showToast("已清空全部数据"); setTimeout(()=>location.reload(),600);
}

/* ============ 图片处理 ============ */
function readFile(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result); r.onerror=()=>reject(r.error); r.readAsDataURL(file);
  });
}
function compressImage(dataUrl,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      const scale=Math.min(1,maxDim/Math.max(w,h));
      w=Math.round(w*scale); h=Math.round(h*scale);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>reject(new Error("图片解码失败"));
    img.src=dataUrl;
  });
}

/* ============ 拍照分析入口（由聊天触发） ============ */
// 照片已通过 fileInput -> pendingPhoto 流程附加；发送时若带图，服务端调用分析逻辑。
// 为直接完成“拍照分析”，在 sendChat 中检测带图消息并替换为分析动作：
sendChat = async function(){
  const input=$("#chatInput");
  const text=input.value.trim();
  const hasPhoto=!!pendingPhoto;
  if(!text && !hasPhoto){ showToast("请输入内容或先拍照"); return; }
  if(!getApiKey()){ showToast("请先在「我的」配置 API Key"); return; }
  input.value="";

  if(hasPhoto){
    const photo=pendingPhoto; pendingPhoto=null;
    chat.push({role:"user",text:text||"请分析这张食物的营养成分。",image:photo,ts:Date.now()});
    await saveChat(); renderChat();
    if(!providerVision()){
      textFoodMode=true;
      chat.push({role:"assistant",text:"当前模型（"+providerLabel()+"）不支持图片识别。请直接输入食物名称和大致份量（例如：米饭一碗、鸡胸肉150克），我会帮你估算营养。",ts:Date.now()});
      await saveChat(); renderChat();
      return;
    }
    setTyping(true);
    try{
      const j=await analyzeFoodPhoto(photo,currentMeal);
      await saveFoodRecord(j,photo,currentMeal,"ai");
      chat.push({role:"assistant",text:nutritionText(j),ts:Date.now()});
      await saveChat();
    }catch(e){
      chat.push({role:"assistant",text:"分析失败："+e.message,ts:Date.now()}); await saveChat();
    }
    setTyping(false); renderChat();
    return;
  }

  if(textFoodMode){
    textFoodMode=false;
    chat.push({role:"user",text:text,ts:Date.now()});
    await saveChat(); renderChat(); setTyping(true);
    try{
      const j=await analyzeFoodText(text,currentMeal);
      await saveFoodRecord(j,null,currentMeal,"ai");
      chat.push({role:"assistant",text:nutritionText(j),ts:Date.now()});
      await saveChat();
    }catch(e){
      chat.push({role:"assistant",text:"分析失败："+e.message,ts:Date.now()}); await saveChat();
    }
    setTyping(false); renderChat();
    return;
  }

  // 纯文本对话（流式输出，提升响应体感）
  const userMsg={id:++msgSeq,role:"user",text:text,ts:Date.now()};
  const aiMsg={id:++msgSeq,role:"assistant",text:"",ts:Date.now()};
  chat.push(userMsg); chat.push(aiMsg);
  await saveChat(); renderChat();
  const bubble=document.querySelector(`[data-msg-id="${aiMsg.id}"] .bubble`);
  let full="";
  try{
    full=await callAIStream(buildChatInput(chat.slice(0,-1)), healthInstructions(), d=>{
      full+=d; aiMsg.text=full;
      if(bubble) bubble.textContent=full;
      scrollChat();
    });
    aiMsg.text=full;
    if(bubble) bubble.textContent=full;
    await saveChat();
  }catch(e){
    aiMsg.text="出错了："+e.message;
    if(bubble) bubble.textContent=aiMsg.text;
    await saveChat();
  }
  scrollChat();
};

async function saveFoodRecord(j,image,meal,source){
  const rec=normalizeFoodRecord(j,image,meal,source);
  await idbPut("foods",rec);
}

document.addEventListener("DOMContentLoaded",init);
</script>
