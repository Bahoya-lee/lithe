plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qingyingji.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.qingyingji.app"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
